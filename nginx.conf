user www-data;
worker_processes auto;
pid /run/nginx.pid;
# Nginx error records can include a full request/query; keep only safe access logs.
error_log /dev/null crit;
events { worker_connections 1024; }
http {
  log_format safe '$remote_addr - - [$time_local] "$request_method $uri" $status';
  access_log /var/log/security/access.log safe;
  server {
    listen 8000;
    location / {
      proxy_pass http://127.0.0.1:8008;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For "";
      proxy_set_header Forwarded "";
    }
  }
}
