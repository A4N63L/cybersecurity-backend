name: ciber-p1-games
services:
  backend:
    image: ciber-p1-games-backend:dev
    build:
      context: .
      network: host
      additional_contexts:
        security: ${AUTH_PROJECT_DIR:-../videojuegos-auth}/common
    environment:
      DATABASE_URL: sqlite:////data/games.db
    cap_add: [NET_ADMIN]
    ports: ["127.0.0.1:8001:8000"]
    volumes: [games_data:/data]
    networks: [lab]
    healthcheck:
      test: [CMD, python3, /opt/security/health.py]
      interval: 10s
      timeout: 5s
      retries: 15
  frontend:
    image: ciber-p1-games-frontend:dev
    build:
      context: ../videojuegos-frontend
      network: host
      additional_contexts:
        security: ${AUTH_PROJECT_DIR:-../videojuegos-auth}/common
    cap_add: [NET_ADMIN]
    ports: ["127.0.0.1:4200:4200"]
    depends_on:
      backend: {condition: service_healthy}
      auth-migrate: {condition: service_completed_successfully}
    networks: [lab]
    healthcheck:
      test: [CMD, python3, /opt/security/health.py]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
volumes:
  games_data:
networks:
  lab:
